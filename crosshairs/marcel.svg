<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" shape-rendering="crispEdges">
  <rect width="120" height="120" fill="#1b1f27" />
  
  <!-- Outer Outline -->
  <rect x="40" y="40" width="40" height="40" fill="none" stroke="#000000" stroke-width="6" />
  <!-- Outer Box -->
  <rect x="42" y="42" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="4" />
  <!-- Inner Dot/Block Outline -->
  <rect x="52" y="52" width="16" height="16" fill="#000000" />
  <!-- Inner Dot/Block Core -->
  <rect x="55" y="55" width="10" height="10" fill="#000000" stroke="#ffffff" stroke-width="2" />

</svg>